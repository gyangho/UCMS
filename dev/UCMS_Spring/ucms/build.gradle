plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.gyangho'
// 2026-08-19: Prepare the next release and its single pending Flyway migration as version 0.1.1.
version = '0.1.1-SNAPSHOT'

java {
	toolchain {
		// 2026-08-23: Use the locally installed LTS toolchain so Gradle builds work outside Docker as well.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// 2026-08-23: Deliver UCMS verification mail through Gmail SMTP with JavaMailSender.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 2026-08-23: Generate password hashes compatible with the existing Node scrypt login verifier.
	implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	// 2026-08-23: Existing login sessions remain in Node; the Spring mail backend stays stateless.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 2026-08-23: Parse Google Forms REST payloads in the Spring-owned synchronization adapter.
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	// 2026-08-23: Spring reads Google Forms through the existing service-account key without exposing it to the web client.
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.40.0'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
