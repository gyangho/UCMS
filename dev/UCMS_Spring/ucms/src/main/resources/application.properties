spring.application.name=ucms

# 2026-08-19: Reuse deployment DB env values and let Flyway exclusively own schema changes.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ucms_dev}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# 2026-08-19: Existing production databases start at 0.0.1; enable baseline-on-migrate only for their first Flyway adoption.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-version=0.0.1
spring.flyway.baseline-description=UCMS production schema before Flyway
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
