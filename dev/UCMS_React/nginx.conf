server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 2026-07-23: Vite assets are content-hashed and can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2026-07-23: Client-side React routes must fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
