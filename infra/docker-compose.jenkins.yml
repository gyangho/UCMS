services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: ucms_jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
      # 2026-07-24: Keep the inbound-agent port local so only 80 and 443 are externally reachable.
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins

volumes:
  jenkins_home:

networks:
  jenkins:
