services:
  # 2026-08-23: Gmail SMTP is isolated in the Spring backend and is not published by Nginx.
  ucms_spring:
    init: true
    build:
      context: ../dev/UCMS_Spring/ucms
      dockerfile: Dockerfile
      target: prod
    image: gyangho/ucms_spring:latest
    container_name: ucms_spring
    restart: always
    env_file:
      - ./env/prod/web.env
      - ./env/prod/common.env
      - path: ./env/prod/spring.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      prod-app:
        # 2026-08-23: Keep the internal HTTP host valid for Tomcat in production too.
        aliases:
          - ucms-spring
      prod-db: {}

  ucms_web:
    init: true
    image: gyangho/ucms_web:latest
    container_name: ucms_web
    restart: always
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/prod/web.env
      - ./env/prod/common.env
    volumes:
      # 2026-07-23: Mount Google credentials at the intended container path with valid Compose syntax.
      - ./env/keys/google:/app/keys/google
      - ../prod/UCMS_WebServer/InterviewScheduler:/app/InterviewScheduler
      # 2026-08-19: The removed legacy EJS result page no longer needs its missing CSV bind mount.
    # 2026-07-23: MySQL is managed by the separate infra Compose project on prod-db.
    networks:
      - prod-app
      - prod-db

  ucms_sharedb:
    init: true
    image: gyangho/ucms_sharedb:latest
    container_name: ucms_sharedb
    restart: always
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/prod/sharedb.env
      - ./env/prod/common.env
    # 2026-07-23: MySQL is managed by the separate infra Compose project on prod-db.
    networks:
      - prod-app
      - prod-db

  # 2026-07-23: Build React once and serve only the generated static files in production.
  ucms_react:
    init: true
    build:
      context: ../dev/UCMS_React
      dockerfile: Dockerfile
      target: prod
    image: gyangho/ucms_react:latest
    container_name: ucms_react
    restart: always
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/prod/react.env
    networks:
      - prod-app

networks:
  prod-app:
    name: ucms-prod-app-network
    external: true

  prod-db:
    name: ucms-prod-db-network
    external: true
