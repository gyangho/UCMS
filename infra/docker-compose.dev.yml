services:
  ucms_web:
    init: true
    build:
      context: ../dev/UCMS_WebServer
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_web
    restart: always
    env_file:
      - ./env/dev/web.env
      - ./env/dev/common.env
    volumes:
      - ./env/keys/google:/app/keys/google
      - ../dev/UCMS_WebServer:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_sharedb:
    init: true
    build:
      context: ../dev/UCMS_ShareDB
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_sharedb
    restart: always
    environment:
      NODE_ENV: dev
      DB_HOST: mysql
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    env_file:
      - ./env/dev/sharedb.env
      - ./env/dev/common.env
    volumes:
      - ../dev/UCMS_ShareDB:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_react:
    init: true
    build:
      context: ../dev/UCMS_React
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_react
    restart: always
    depends_on:
      - ucms_web
    environment:
      NODE_ENV: dev
      # 2026-07-16: Vite runs inside its own container, so proxy /api to the Compose web service.
      VITE_API_PROXY_TARGET: http://ucms_web:3000
      # 2026-07-23: Proxy React evaluation-note sockets to the ShareDB service during Vite development.
      VITE_SHAREDB_PROXY_TARGET: ws://ucms_sharedb:8080
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "5173:5173"
    volumes:
      - ../dev/UCMS_React:/app
      - /app/node_modules
    networks:
      - dev-app

networks:
  dev-app:
    name: ucms-dev-app-network
    external: true

  dev-db:
    name: ucms-dev-db-network
    external: true
