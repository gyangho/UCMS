services:
  ucms_web:
    init: true
    build:
      context: ../dev/UCMS_WebServer
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_web
    restart: always
    env_file:
      # 2026-07-24: Read the internal WebServer port from the shared infrastructure port file.
      - ./env/ports.env
      - ./env/dev/web.env
      - ./env/dev/common.env
    volumes:
      - ./env/keys/google:/app/keys/google
      - ../dev/UCMS_WebServer:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_sharedb:
    init: true
    build:
      context: ../dev/UCMS_ShareDB
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_sharedb
    restart: always
    environment:
      NODE_ENV: dev
      DB_HOST: mysql
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    env_file:
      # 2026-07-24: Read the internal ShareDB port from the shared infrastructure port file.
      - ./env/ports.env
      - ./env/dev/sharedb.env
      - ./env/dev/common.env
    volumes:
      - ../dev/UCMS_ShareDB:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_react:
    init: true
    build:
      context: ../dev/UCMS_React
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_react
    restart: always
    depends_on:
      - ucms_web
    env_file:
      # 2026-07-24: Vite receives all three internal ports without publishing its port to the host.
      - ./env/ports.env
    environment:
      NODE_ENV: dev
      # 2026-07-24: Vite combines Docker DNS names with WEB_PORT and SHAREDB_PORT.
      VITE_API_PROXY_HOST: ucms_web
      VITE_SHAREDB_PROXY_HOST: ucms_sharedb
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ../dev/UCMS_React:/app
      - /app/node_modules
    networks:
      - dev-app

networks:
  dev-app:
    name: ucms-dev-app-network
    external: true

  dev-db:
    name: ucms-dev-db-network
    external: true
