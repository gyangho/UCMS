services:
  # 2026-08-23: New backend mail delivery runs in Spring and is reachable only on internal app networks.
  ucms_spring:
    init: true
    build:
      context: ../dev/UCMS_Spring/ucms
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_spring
    restart: always
    env_file:
      - ./env/dev/web.env
      - ./env/dev/common.env
      - path: ./env/dev/spring.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ../dev/UCMS_Spring/ucms:/app
      - /home/gradle/.gradle
    networks:
      dev-app:
        # 2026-08-23: Tomcat rejects underscores in HTTP Host, so Node uses this RFC-compliant alias.
        aliases:
          - ucms-spring
      dev-db: {}

  ucms_web:
    init: true
    build:
      context: ../dev/UCMS_WebServer
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_web
    restart: always
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/dev/web.env
      - ./env/dev/common.env
    volumes:
      - ./env/keys/google:/app/keys/google
      - ../dev/UCMS_WebServer:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_sharedb:
    init: true
    build:
      context: ../dev/UCMS_ShareDB
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_sharedb
    restart: always
    environment:
      NODE_ENV: dev
      DB_HOST: mysql
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/dev/sharedb.env
      - ./env/dev/common.env
    volumes:
      - ../dev/UCMS_ShareDB:/app
      - /app/node_modules
    networks:
      - dev-app
      - dev-db

  ucms_react:
    init: true
    build:
      context: ../dev/UCMS_React
      dockerfile: Dockerfile
      target: dev
    container_name: dev_ucms_react
    restart: always
    # 2026-08-19: Start Vite after the API and database-backed health endpoint are ready.
    depends_on:
      ucms_web:
        condition: service_healthy
    env_file:
      # 2026-08-19: Read shared infrastructure values from their relocated env file.
      - ./env/infra/ports.env
      - ./env/dev/react.env
    environment:
      NODE_ENV: dev
      # 2026-07-24: Vite combines Docker DNS names with WEB_PORT and SHAREDB_PORT.
      VITE_API_PROXY_HOST: ucms_web
      VITE_SHAREDB_PROXY_HOST: ucms_sharedb
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ../dev/UCMS_React:/app
      - /app/node_modules
    networks:
      - dev-app

networks:
  dev-app:
    name: ucms-dev-app-network
    external: true

  dev-db:
    name: ucms-dev-db-network
    external: true
